name: 04-using actions 
on:
 push:
  branches:
   - main 
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
    - name: checkout the app repo 
      uses: actions/checkout@v4
    - name: setup nodejs
      uses: actions/setup-node@v5
      with:
        node-version: '20.x'
    - name: install dependencies
      run: npm ci
    - name: run tests
      run: npm test


